name: Scientific checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-reproduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONOPTIMIZE: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Run owned finite checks and frozen synthetic reproduction
        shell: bash
        run: |
          mkdir -p scientific-output
          ulimit -v 2097152
          ulimit -t 540
          timeout --signal=TERM --kill-after=10s 600s python -B reproduce.py --out scientific-output/reproduction > scientific-output/run.stdout.txt 2> scientific-output/run.stderr.txt
      - name: Retain raw outputs, including failures and partial attempts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scientific-output
          path: scientific-output/
          if-no-files-found: warn
          retention-days: 14
